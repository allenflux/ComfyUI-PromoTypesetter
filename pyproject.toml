[project]
name = "comfyui-promo-typesetter"
version = "0.1.1"
description = "Exact-copy promotional image typesetting and background text checks for ComfyUI."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { file = "LICENSE" }
dependencies = [
    "Pillow>=10.4",
    "numpy>=1.24,<3",
    "fonttools>=4.53",
    "regex>=2024.7.24",
    "opencc-python-reimplemented>=0.1.7",
    "rapidocr-onnxruntime==1.4.4",
    "opencv-python==4.12.0.88",
    "onnxruntime>=1.18,<2",
]

[project.urls]
Repository = "https://github.com/allenflux/ComfyUI-PromoTypesetter"

[tool.comfy]
DisplayName = "Promo Typesetter"
includes = ["fonts", "examples"]
