name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-ocr.txt
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Install CPU PyTorch for tests outside ComfyUI
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Set up private OCR runtime
        run: python scripts/setup_ocr.py
      - name: Run unit and OCR integration tests
        run: python -m unittest discover -s tests -v
      - name: Test OCR engine inside its own environment
        run: .venv-ocr/bin/python -m unittest discover -s tests -p test_ocr.py -v
