name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Install CPU PyTorch for tests outside ComfyUI
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Check OCR dependency is importable
        run: python -c "from rapidocr_onnxruntime import RapidOCR; import onnxruntime"
      - name: Run unit and OCR integration tests
        run: python -m unittest discover -s tests -v
